[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "helix-platform"
version = "0.1.0"
description = "Local readiness checks for Python multi-agent projects"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
keywords = ["agents", "configuration", "diagnostics", "readiness"]
dependencies = []

[project.urls]
Repository = "https://github.com/Deathcharge/helix-platform"
Issues = "https://github.com/Deathcharge/helix-platform/issues"

[project.scripts]
helix-platform = "helix_platform.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
helix_platform = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["helix_platform"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

