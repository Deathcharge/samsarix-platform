name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install package
        run: python -m pip install --disable-pip-version-check .

      - name: Run unit and command tests
        run: python -m unittest discover -s tests -v

      - name: Validate contracts without application credentials
        run: samsarix-platform validate samsarix-stack.toml examples/agent-project/samsarix-stack.toml --json

      - name: Run strict repository readiness check
        run: samsarix-platform doctor samsarix-stack.toml --strict

      - name: Verify JSON readiness output
        run: samsarix-platform doctor samsarix-stack.toml --json --strict

      - name: Verify hash-locked tools on this Python and OS
        run: |
          python scripts/lock_dependencies.py --check
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-dev.lock
          python -m pip check
          python -m unittest discover -s tests

  quality:
    name: Quality and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Check dependency lock inputs
        run: python scripts/lock_dependencies.py --check

      - name: Install hash-locked development and build tools
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Verify pip rejects mismatched dependency hashes
        run: python scripts/verify_locked_environment.py --hash-rejection-only

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy src tests scripts

      - name: Test with branch coverage
        run: |
          python -m coverage erase
          python -m coverage run -m unittest discover -s tests
          python -m coverage report

      - name: Audit runtime dependencies
        run: python -m pip_audit . --strict --progress-spinner off

      - name: Audit locked development dependencies
        run: python -m pip_audit -r requirements-dev.lock --strict --progress-spinner off

      - name: Verify real pre-commit consumer integration
        run: python scripts/verify_pre_commit.py

      - name: Verify editor schema with JSON Schema and Taplo
        run: python scripts/verify_editor_schema.py

      - name: Build distributions
        run: python -m build --no-isolation

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Verify source archive and isolated wheel
        run: python scripts/verify_artifacts.py

      - name: Reinstall and smoke-test the wheel
        run: |
          python -m pip install --disable-pip-version-check --force-reinstall dist/*.whl
          samsarix-platform --version
          samsarix-platform doctor samsarix-stack.toml --strict
          python -m samsarix_platform --version
          python -m pip check
