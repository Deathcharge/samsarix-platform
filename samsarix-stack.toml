schema_version = 2

[project]
name = "Samsarix Platform Doctor"
requires_python = ">=3.11"

[[components]]
name = "Samsarix Platform Doctor package"
distribution = "samsarix-platform"
version = ">=0.2,<0.3"
required = true
description = "The installed CLI distribution"

[[executables]]
name = "Git"
command = "git"
required = true
description = "Source-control client used by the contributor workflow"

[[files]]
path = "README.md"
required = true
description = "User-facing product documentation"

[[files]]
path = "pyproject.toml"
required = true
description = "Build and package metadata"

[[files]]
path = "src/samsarix_platform/cli.py"
required = true
description = "CLI entry point"
