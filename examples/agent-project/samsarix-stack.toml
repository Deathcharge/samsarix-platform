schema_version = 2

[project]
name = "Example agent project"
requires_python = ">=3.11"

[[components]]
name = "OpenAI Python SDK"
distribution = "openai"
version = ">=1,<3"
required = false
description = "Only required when the project selects OpenAI as its provider"

[[executables]]
name = "Git"
command = "git"
required = true
description = "Source-control client used by the project workflow"

[[environment]]
name = "OPENAI_API_KEY"
required = false
secret = true
description = "Only required for authenticated OpenAI requests"

[[files]]
path = "README.md"
required = true
description = "Example instructions"
