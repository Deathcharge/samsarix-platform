schema_version = 2

[project]
name = "Production research agent contract"
requires_python = ">=3.11"

[[components]]
name = "OpenAI SDK"
distribution = "openai"
version = ">=1,<3"

[[executables]]
name = "Git"
command = "git"

[[environment]]
name = "OPENAI_API_KEY"
secret = true

[[files]]
path = "config/agents.toml"
description = "Configuration generated by a deployment pipeline, not stored in this example"
